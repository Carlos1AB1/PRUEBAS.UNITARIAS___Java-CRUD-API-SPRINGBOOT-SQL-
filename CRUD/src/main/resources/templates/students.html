<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Estudiantes</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">CRUD de Estudiantes</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/student">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/student/new">Agregar Estudiante</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="text-center">Lista de Estudiantes</h1>
    <div class="text-end mb-3">
        <a href="/student/new" class="btn btn-primary">+ Agregar Estudiante</a>
    </div>

    <table class="table table-hover table-striped">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}">
            <td th:text="${student.studentId}"></td>
            <td th:text="${student.primerNombre} + ' ' + ${student.segundoNombre}"></td>
            <td th:text="${student.email}"></td>
            <td>
                <a th:href="@{'/student/edit/' + ${student.studentId}}" class="btn btn-warning btn-sm">Editar</a>
                <button class="btn btn-danger btn-sm delete-btn" data-id="${student.studentId}">Eliminar</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

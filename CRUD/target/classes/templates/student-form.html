<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agregar/Editar Estudiante</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/script.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center" th:text="${student.studentId == null ? 'Agregar Estudiante' : 'Editar Estudiante'}"></h2>

    <form th:action="@{/student/save}" th:object="${student}" method="post" class="custom-form">
        <input type="hidden" th:field="*{studentId}">

        <div class="mb-3">
            <label class="form-label">Primer Nombre</label>
            <input type="text" class="form-control" th:field="*{primerNombre}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Segundo Nombre</label>
            <input type="text" class="form-control" th:field="*{segundoNombre}">
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="/student" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
